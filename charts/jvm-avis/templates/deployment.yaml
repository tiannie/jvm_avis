apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jvm-avis.fullname" . }}
  labels:
    {{- include "jvm-avis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jvm-avis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "jvm-avis.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "jvm-avis.serviceAccountName" . }}
      # Avoid K8s service-link env (e.g. JVM_AVIS_PORT=tcp://...) colliding with app config.
      enableServiceLinks: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: collector
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.target.host }}
            - --target
            - {{ printf "%s:%v" .Values.target.host .Values.target.port | quote }}
            {{- end }}
            - --jfr-dump-interval-s
            - {{ .Values.config.jfrDumpIntervalSeconds | quote }}
            - --metric-interval-ms
            - {{ .Values.config.metricIntervalMs | quote }}
            - --dump-dir
            - {{ .Values.config.dumpDir | quote }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: JVM_AVIS_HOST
              value: "0.0.0.0"
            - name: JVM_AVIS_PORT
              value: "8080"
            - name: JVM_AVIS_RETENTION_S
              value: {{ .Values.config.retentionSeconds | quote }}
            - name: JVM_AVIS_RECORDING_NAME
              value: {{ .Values.config.recordingName | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
